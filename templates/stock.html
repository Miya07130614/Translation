<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>股市行情查詢</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f7; margin: 0; }
        header { background-color: #2e7d32; color: white; padding: 20px; text-align: center; }
        section { display: flex; justify-content: center; margin-top: 40px; }
        .form-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 450px; }
        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .button-group { display: flex; gap: 10px; }
        input[type="submit"], .btn-home { flex: 1; padding: 12px; border: none; border-radius: 5px; cursor: pointer; text-align: center; text-decoration: none; font-size: 16px; }
        input[type="submit"] { background: #4CAF50; color: white; }
        .btn-home { background: #e0e0e0; color: #333; }
        .result-box { margin-top: 20px; padding: 15px; background: #e8f5e9; border-left: 5px solid #4CAF50; border-radius: 4px; font-size: 14px; white-space: pre-line; }
    </style>
</head>
<body>
    <header><h1>股市行情查詢</h1></header>
    <section>
        <div class="form-box">
            <form method="post">
                <label>請輸入股票代號或指數名稱：</label>
                <input type="text" name="question" placeholder="例如: 2330 或 發行量加權股價指數" value="{{ question }}" required>
                <div class="button-group">
                    <input type="submit" value="開始查詢">
                    <a href="/" class="btn-home">回首頁</a>
                </div>
            </form>
            {% if answer %}
            <div class="result-box"><strong>查詢結果：</strong><br>{{ answer }}</div>
            {% endif %}
        </div>
    </section>
</body>
</html>
